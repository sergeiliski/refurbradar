<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refurb Radar</title>
  <meta name="description" content="Rank every refurbished M1 to M5 MacBook Pro on Back Market UK by what matters to you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='14' y='3' width='4' height='26' rx='2' fill='%23bcc1c8'/%3E%3Crect x='14' y='14' width='4' height='15' rx='2' fill='%231f5bff'/%3E%3Crect x='7' y='10' width='18' height='8' rx='2' fill='%231d2026'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <!-- Runs before the first paint, so a saved theme never flashes the other one. -->
  <script>try { const theme = localStorage.getItem('refurbradar:theme'); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="./">Refurb Radar</a>
      <p class="status" id="status">Loading listings…</p>
      <button class="pill" type="button" id="theme" aria-pressed="false">Dark theme</button>
    </header>

    <main>
      <section class="hero" id="hero" aria-live="polite"></section>

      <section class="desk" aria-labelledby="desk-title">
        <div class="desk-head">
          <h2 id="desk-title">What matters to you</h2>
          <div class="presets" role="group" aria-label="Presets">
            <button class="pill" type="button" data-preset="balanced">Balanced</button>
            <button class="pill" type="button" data-preset="power">Power</button>
            <button class="pill" type="button" data-preset="budget">Budget</button>
          </div>
        </div>

        <div class="faders" id="faders"></div>

        <div class="filters">
          <fieldset class="segmented" id="size">
            <legend>Screen</legend>
            <input type="radio" name="size" id="size-any" value="any" checked><label class="pill" for="size-any">Any</label>
            <input type="radio" name="size" id="size-14" value="14"><label class="pill" for="size-14">14″</label>
            <input type="radio" name="size" id="size-16" value="16"><label class="pill" for="size-16">16″</label>
          </fieldset>
          <label class="budget">Max price <input type="number" id="budget" inputmode="numeric" min="0" step="50" placeholder="Any £"></label>
          <label class="toggle"><input type="checkbox" id="show-sold"> Include listings not seen this week</label>
        </div>
      </section>

      <section class="ranking" aria-labelledby="ranking-title">
        <div class="ranking-head">
          <h2 id="ranking-title">Ranked for you</h2>
          <p id="count"></p>
        </div>
        <ol class="rows" id="rows"></ol>
        <p class="empty-note" id="empty-note" hidden></p>
      </section>
    </main>

    <footer class="footer">
      <p>Prices from Back Market UK, refreshed daily. Not affiliated with Back Market.</p>
    </footer>
  </div>
</body>
</html>
